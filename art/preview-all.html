<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>All Sprites</title>
<style>
  body { margin: 0; padding: 20px; background: #14162B; font: 13px system-ui, sans-serif; color: #FFF7E6; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; align-items: flex-end; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .bg { display: flex; align-items: center; justify-content: center; padding: 8px; border-radius: 10px; }
  .grass { background: #74D06B; } .water { background: #3E9CE6; } .road { background: #4B505A; } .home { background: #2F8A48; }
  img { display: block; height: 96px; width: auto; }
</style>
</head>
<body>
<h1>Ribbit Rush: all sprites at 2x</h1>
<div class="row">
  <div class="cell"><div class="bg road"><img src="/assets/sprites/car.svg"></div>car (ref)</div>
  <div class="cell"><div class="bg road"><img src="/assets/sprites/taxi.svg"></div>taxi</div>
  <div class="cell"><div class="bg road"><img src="/assets/sprites/sports.svg"></div>sports</div>
  <div class="cell"><div class="bg road"><img src="/assets/sprites/motorbike.svg"></div>motorbike</div>
  <div class="cell"><div class="bg road"><img src="/assets/sprites/pickup.svg"></div>pickup</div>
  <div class="cell"><div class="bg road"><img src="/assets/sprites/van.svg"></div>van</div>
</div>
<div class="row">
  <div class="cell"><div class="bg road"><img src="/assets/sprites/truck.svg"></div>truck</div>
  <div class="cell"><div class="bg road"><img src="/assets/sprites/bus.svg"></div>bus</div>
  <div class="cell"><div class="bg water"><img src="/assets/sprites/croc.svg"></div>croc</div>
  <div class="cell"><div class="bg home"><img src="/assets/sprites/fly.svg"></div>fly</div>
  <div class="cell"><div class="bg home"><img src="/assets/sprites/hedge.svg"><img src="/assets/sprites/hedge.svg"></div>hedge x2</div>
  <div class="cell"><div class="bg road"><img src="/assets/sprites/kerb.svg"><img src="/assets/sprites/kerb.svg"></div>kerb x2</div>
</div>
<div class="row">
  <div class="cell"><div class="bg grass"><img src="/assets/sprites/frog-idle.svg"></div>frog-idle (ref)</div>
  <div class="cell"><div class="bg grass"><img src="/assets/sprites/frog-jump.svg"></div>frog-jump (ref)</div>
  <div class="cell"><div class="bg water"><img src="/assets/sprites/turtle.svg"></div>turtle (ref)</div>
  <div class="cell"><div class="bg water"><img src="/assets/sprites/lilypad.svg"></div>lilypad (ref)</div>
  <div class="cell"><div class="bg water"><img src="/assets/sprites/log-end.svg"><img src="/assets/sprites/log-mid.svg"></div>log (ref)</div>
</div>
</body>
</html>
