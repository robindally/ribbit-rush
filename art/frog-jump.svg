<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Ribbit Rush hero frog, mid-hop: legs extended, facing up -->
  <!-- back legs extended down and out -->
  <g fill="#3FA84A">
    <ellipse cx="11.5" cy="38" rx="4.2" ry="9.5" transform="rotate(32 11.5 38)"/>
    <ellipse cx="36.5" cy="38" rx="4.2" ry="9.5" transform="rotate(-32 36.5 38)"/>
  </g>
  <g fill="#8BEA7B">
    <ellipse cx="6.5" cy="45" rx="3.6" ry="2.6" transform="rotate(-40 6.5 45)"/>
    <circle cx="3.2" cy="46.4" r="1.4"/><circle cx="5.6" cy="47.2" r="1.3"/>
    <ellipse cx="41.5" cy="45" rx="3.6" ry="2.6" transform="rotate(40 41.5 45)"/>
    <circle cx="44.8" cy="46.4" r="1.4"/><circle cx="42.4" cy="47.2" r="1.3"/>
  </g>
  <!-- front legs reaching forward -->
  <g fill="#58D65E">
    <ellipse cx="11" cy="17" rx="3.4" ry="7.5" transform="rotate(-14 11 17)"/>
    <ellipse cx="37" cy="17" rx="3.4" ry="7.5" transform="rotate(14 37 17)"/>
  </g>
  <g fill="#8BEA7B">
    <ellipse cx="9" cy="10" rx="3.4" ry="2.6"/>
    <circle cx="6.8" cy="7.6" r="1.3"/><circle cx="9.2" cy="6.8" r="1.3"/><circle cx="11.5" cy="7.8" r="1.3"/>
    <ellipse cx="39" cy="10" rx="3.4" ry="2.6"/>
    <circle cx="41.2" cy="7.6" r="1.3"/><circle cx="38.8" cy="6.8" r="1.3"/><circle cx="36.5" cy="7.8" r="1.3"/>
  </g>
  <!-- body + head, elongated -->
  <g fill="#4BB650">
    <ellipse cx="24.8" cy="29" rx="11" ry="15.5"/>
    <ellipse cx="24.8" cy="15.2" rx="12" ry="10"/>
  </g>
  <g fill="#58D65E">
    <ellipse cx="24" cy="28" rx="11" ry="15.5"/>
    <ellipse cx="24" cy="14" rx="12" ry="10"/>
  </g>
  <g fill="#3FA84A" opacity="0.35">
    <circle cx="27" cy="32" r="2.2"/><circle cx="21" cy="36" r="1.6"/><circle cx="28.5" cy="40" r="1.3"/>
  </g>
  <ellipse cx="19" cy="23" rx="4.8" ry="3.4" fill="#FFFFFF" opacity="0.16" transform="rotate(-25 19 23)"/>
  <!-- eyes, slightly wider apart, looking ahead -->
  <g>
    <circle cx="15" cy="7.5" r="6" fill="#2F7A3A"/>
    <circle cx="15" cy="7.5" r="4.7" fill="#FFFFFF"/>
    <circle cx="15.3" cy="6.6" r="2.6" fill="#1B2A1D"/>
    <circle cx="14.2" cy="5.3" r="1.1" fill="#FFFFFF"/>
    <circle cx="33" cy="7.5" r="6" fill="#2F7A3A"/>
    <circle cx="33" cy="7.5" r="4.7" fill="#FFFFFF"/>
    <circle cx="32.7" cy="6.6" r="2.6" fill="#1B2A1D"/>
    <circle cx="31.6" cy="5.3" r="1.1" fill="#FFFFFF"/>
  </g>
  <circle cx="22" cy="11.6" r="0.85" fill="#2F7A3A"/>
  <circle cx="26" cy="11.6" r="0.85" fill="#2F7A3A"/>
  <!-- open-mouth grin -->
  <path d="M17.5 16 Q24 22.5 30.5 16 Q24 18.8 17.5 16 Z" fill="#2F7A3A"/>
</svg>
