<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 48" width="96" height="48">
  <!-- Ribbit Rush jet ski, faces right. Body ~72px, rider on top; spray is drawn in code
       (docs/specs/M6-worlds.md section 5). Body colour reuses the sports car's teal (no jet-ski
       token exists in the bible's vehicle table), rider reuses the motorbike rider red. -->
  <!-- hull: front face (darker) then top face, pointed nose at the right -->
  <path d="M14 34 C10 34 8 30 8 26 C8 21 12 18 20 17 L64 17 C78 17 88 21 88 27 C88 32 78 36 60 36 Z" fill="#22897E"/>
  <path d="M15 32.5 C11.5 32.5 9.5 29 9.5 25.5 C9.5 21 13 18.5 20.5 17.5 L63 17.5 C76 17.5 85.5 21 85.5 26.5 C85.5 31 76 34 59 34 Z" fill="#2DBFB0" stroke="#26A89B" stroke-width="1.5"/>
  <!-- deck seam -->
  <path d="M22 20 C40 18.5 58 18.5 76 22" fill="none" stroke="#1E8177" stroke-width="1.4" stroke-linecap="round"/>
  <!-- rider: seated blob + shoulders + helmet -->
  <ellipse cx="40" cy="21" rx="9" ry="6" fill="#E8474B"/>
  <circle cx="46" cy="13" r="5.4" fill="#E8474B"/>
  <ellipse cx="44.3" cy="11.2" rx="2" ry="1.3" fill="#FFFFFF" opacity="0.3"/>
  <!-- handlebar hint -->
  <path d="M56 18 L62 13" stroke="#22242A" stroke-width="2" stroke-linecap="round"/>
  <!-- running light at the nose -->
  <circle cx="84" cy="26" r="1.6" fill="#FFF1A8"/>
  <!-- hull highlight -->
  <ellipse cx="24" cy="21" rx="8" ry="2.6" fill="#FFFFFF" opacity="0.22"/>
</svg>
