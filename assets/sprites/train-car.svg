<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 48" width="96" height="48">
  <!-- Ribbit Rush train car (plain carriage), composes with train-engine (bible vehicle table:
       #8E3B46 with #DDDDDD stripe). Blunt at both ends, unlike the engine's tapered nose. -->
  <rect x="3" y="12" width="90" height="26" rx="6" fill="#6E2E38"/>
  <rect x="3" y="12" width="90" height="20" rx="6" fill="#8E3B46" stroke="#7A3340" stroke-width="1.3"/>
  <rect x="3" y="27" width="90" height="4.5" fill="#DDDDDD"/>
  <g fill="#2B3A55">
    <rect x="9" y="16" width="14" height="9.5" rx="3"/>
    <rect x="27" y="16" width="14" height="9.5" rx="3"/>
    <rect x="45" y="16" width="14" height="9.5" rx="3"/>
    <rect x="63" y="16" width="14" height="9.5" rx="3"/>
  </g>
  <g fill="#9FB7E6" opacity="0.45">
    <rect x="10.3" y="17.2" width="4" height="3" rx="1"/>
    <rect x="28.3" y="17.2" width="4" height="3" rx="1"/>
    <rect x="46.3" y="17.2" width="4" height="3" rx="1"/>
    <rect x="64.3" y="17.2" width="4" height="3" rx="1"/>
  </g>
  <!-- couplings, both ends -->
  <rect x="0.5" y="22" width="3" height="4" rx="1.2" fill="#3B1F24"/>
  <rect x="92.5" y="22" width="3" height="4" rx="1.2" fill="#3B1F24"/>
  <!-- highlight -->
  <ellipse cx="14" cy="16.5" rx="7" ry="1.8" fill="#FFFFFF" opacity="0.18"/>
</svg>
