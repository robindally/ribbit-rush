<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 48" width="96" height="48">
  <!-- Ribbit Rush pickup, faces right. 1.5-tile body (72px) centred in a 2-tile canvas. -->
  <g fill="#22242A">
    <rect x="24" y="8" width="9" height="7" rx="2.5"/>
    <rect x="64" y="8" width="9" height="7" rx="2.5"/>
    <rect x="24" y="33" width="9" height="7" rx="2.5"/>
    <rect x="64" y="33" width="9" height="7" rx="2.5"/>
  </g>
  <!-- front face (darker) then top face -->
  <rect x="12" y="11" width="72" height="26" rx="8" fill="#567B3A"/>
  <rect x="12" y="11" width="72" height="21.3" rx="8" fill="#6E9E4A" stroke="#5E863F" stroke-width="1.5"/>
  <!-- open bed at the rear (left) -->
  <rect x="15" y="15" width="42" height="14.5" rx="4" fill="#567B3A"/>
  <rect x="17" y="16.5" width="38" height="9.5" rx="3" fill="#4B6B33"/>
  <rect x="15.5" y="15.3" width="41" height="2.2" fill="#FFFFFF" opacity="0.14"/>
  <!-- cab, at the front (right) -->
  <rect x="60" y="13.5" width="21" height="16.5" rx="5" fill="#2B3A55"/>
  <rect x="64" y="15.5" width="12" height="12.5" rx="3.5" fill="#7BAC57"/>
  <path d="M77.5 16.5 L79 26" fill="none" stroke="#9FB7E6" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <!-- highlight -->
  <ellipse cx="20" cy="16" rx="6" ry="2.4" fill="#FFFFFF" opacity="0.22"/>
  <ellipse cx="76" cy="15.5" rx="3.6" ry="1.8" fill="#FFFFFF" opacity="0.16"/>
  <!-- headlights (front, right) and taillights (rear, left) -->
  <rect x="81" y="14" width="3.2" height="5" rx="1.6" fill="#FFF1A8"/>
  <rect x="81" y="24.5" width="3.2" height="5" rx="1.6" fill="#FFF1A8"/>
  <rect x="11.8" y="17" width="3" height="4.6" rx="1.5" fill="#FF3B3B"/>
  <rect x="11.8" y="24.5" width="3" height="4.6" rx="1.5" fill="#FF3B3B"/>
</svg>
