<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Ribbit Rush hero frog, idle, facing up. Palette per docs/ART_BIBLE.md -->
  <!-- back feet -->
  <g fill="#8BEA7B">
    <ellipse cx="7" cy="41" rx="4.2" ry="3.2" transform="rotate(-25 7 41)"/>
    <circle cx="3.6" cy="43.2" r="1.6"/><circle cx="5.2" cy="45.2" r="1.6"/><circle cx="8.4" cy="45.4" r="1.6"/>
    <ellipse cx="41" cy="41" rx="4.2" ry="3.2" transform="rotate(25 41 41)"/>
    <circle cx="44.4" cy="43.2" r="1.6"/><circle cx="42.8" cy="45.2" r="1.6"/><circle cx="39.6" cy="45.4" r="1.6"/>
  </g>
  <!-- haunches -->
  <g fill="#3FA84A">
    <ellipse cx="12" cy="33" rx="8" ry="9.5" transform="rotate(-22 12 33)"/>
    <ellipse cx="36" cy="33" rx="8" ry="9.5" transform="rotate(22 36 33)"/>
  </g>
  <!-- front feet -->
  <g fill="#8BEA7B">
    <ellipse cx="9.5" cy="20" rx="3.6" ry="2.8"/>
    <circle cx="7.2" cy="17.4" r="1.4"/><circle cx="9.6" cy="16.6" r="1.4"/><circle cx="12" cy="17.6" r="1.4"/>
    <ellipse cx="38.5" cy="20" rx="3.6" ry="2.8"/>
    <circle cx="40.8" cy="17.4" r="1.4"/><circle cx="38.4" cy="16.6" r="1.4"/><circle cx="36" cy="17.6" r="1.4"/>
  </g>
  <!-- front arms -->
  <g fill="#58D65E">
    <ellipse cx="12.5" cy="24" rx="3.8" ry="6" transform="rotate(28 12.5 24)"/>
    <ellipse cx="35.5" cy="24" rx="3.8" ry="6" transform="rotate(-28 35.5 24)"/>
  </g>
  <!-- body + head: shade rim then top face -->
  <g fill="#4BB650">
    <ellipse cx="24.8" cy="29.2" rx="13" ry="14"/>
    <ellipse cx="24.8" cy="16.2" rx="12.5" ry="10.5"/>
  </g>
  <g fill="#58D65E">
    <ellipse cx="24" cy="28" rx="13" ry="14"/>
    <ellipse cx="24" cy="15" rx="12.5" ry="10.5"/>
  </g>
  <!-- back spots -->
  <g fill="#3FA84A" opacity="0.35">
    <circle cx="27.5" cy="31" r="2.3"/><circle cx="20.5" cy="35" r="1.7"/><circle cx="30" cy="38" r="1.4"/>
  </g>
  <!-- highlight -->
  <ellipse cx="18.5" cy="23.5" rx="5.5" ry="3.2" fill="#FFFFFF" opacity="0.16" transform="rotate(-30 18.5 23.5)"/>
  <!-- eyes -->
  <g>
    <circle cx="15.5" cy="8.5" r="6.2" fill="#2F7A3A"/>
    <circle cx="15.5" cy="8.5" r="4.9" fill="#FFFFFF"/>
    <circle cx="16" cy="9" r="2.7" fill="#1B2A1D"/>
    <circle cx="14.8" cy="7.4" r="1.15" fill="#FFFFFF"/>
    <circle cx="32.5" cy="8.5" r="6.2" fill="#2F7A3A"/>
    <circle cx="32.5" cy="8.5" r="4.9" fill="#FFFFFF"/>
    <circle cx="32" cy="9" r="2.7" fill="#1B2A1D"/>
    <circle cx="30.8" cy="7.4" r="1.15" fill="#FFFFFF"/>
  </g>
  <!-- nostrils + smile -->
  <circle cx="22" cy="12.6" r="0.85" fill="#2F7A3A"/>
  <circle cx="26" cy="12.6" r="0.85" fill="#2F7A3A"/>
  <path d="M17 17.2 Q24 22 31 17.2" fill="none" stroke="#2F7A3A" stroke-width="1.7" stroke-linecap="round"/>
</svg>
