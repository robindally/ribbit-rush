<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Ribbit Rush rail crossing signal, two lights (docs/specs/M6-worlds.md section 5). The red
       flash itself is drawn dynamically over this sprite (render/draw/entities.ts,
       drawRailSignals) using the same train-warning timing as the trainWarning event. -->
  <rect x="21" y="16" width="4" height="28" rx="2" fill="#22242A"/>
  <!-- cross-buck -->
  <g stroke="#F5C518" stroke-width="4" stroke-linecap="round">
    <line x1="10" y1="8" x2="34" y2="16"/>
    <line x1="10" y1="16" x2="34" y2="8"/>
  </g>
  <g stroke="#22242A" stroke-width="1.2" fill="none">
    <line x1="10" y1="8" x2="34" y2="16"/>
    <line x1="10" y1="16" x2="34" y2="8"/>
  </g>
  <!-- two lamp housings (unlit base state; the flash overlay lights the left/right alternately) -->
  <circle cx="17" cy="22" r="3" fill="#3A3D45"/>
  <circle cx="27" cy="22" r="3" fill="#3A3D45"/>
  <circle cx="17" cy="22" r="1.7" fill="#8A1F1F"/>
  <circle cx="27" cy="22" r="1.7" fill="#8A1F1F"/>
</svg>
