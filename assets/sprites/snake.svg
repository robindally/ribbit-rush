<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 48" width="96" height="48">
  <!-- Ribbit Rush snake, faces right (docs/specs/M6-worlds.md section 5: "2x1, body 72px S-curve,
       faces right"). Colours: #C9A24A with #6B4E1E diamonds (bible "Nature and pickups"). -->
  <path d="M10 30 C22 34 26 20 38 18 C50 16 54 30 66 28 C74 26.5 78 22 84 20"
        fill="none" stroke="#B08A3D" stroke-width="10" stroke-linecap="round"/>
  <path d="M10 30 C22 34 26 20 38 18 C50 16 54 30 66 28 C74 26.5 78 22 84 20"
        fill="none" stroke="#C9A24A" stroke-width="8" stroke-linecap="round"/>
  <!-- diamond pattern along the body -->
  <g fill="#6B4E1E">
    <path d="M20 28 L24 24.5 L28 28 L24 31.5 Z"/>
    <path d="M34 21 L38 17.5 L42 21 L38 24.5 Z"/>
    <path d="M50 20.5 L54 17.5 L58 20.5 L54 23.5 Z"/>
    <path d="M64 27 L68 24 L72 27 L68 30 Z"/>
  </g>
  <!-- head -->
  <ellipse cx="88" cy="19" rx="6.5" ry="5" fill="#C9A24A"/>
  <circle cx="90" cy="16.5" r="1.1" fill="#1B2A1D"/>
  <circle cx="86.5" cy="15.5" r="1.1" fill="#1B2A1D"/>
  <!-- forked tongue -->
  <path d="M93.5 19 L95.8 17.6 M93.5 19 L95.8 20.4" stroke="#E8474B" stroke-width="1.3" stroke-linecap="round"/>
  <!-- highlight -->
  <ellipse cx="18" cy="26" rx="6" ry="2.4" fill="#FFFFFF" opacity="0.18" transform="rotate(-20 18 26)"/>
</svg>
