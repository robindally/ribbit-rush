<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Turtle, faces left. Renderer flips for right-moving lanes. -->
  <!-- flippers -->
  <g fill="#8DBF5A">
    <ellipse cx="15" cy="12" rx="5.5" ry="3" transform="rotate(-32 15 12)"/>
    <ellipse cx="15" cy="36" rx="5.5" ry="3" transform="rotate(32 15 36)"/>
    <ellipse cx="35" cy="13" rx="5" ry="3" transform="rotate(30 35 13)"/>
    <ellipse cx="35" cy="35" rx="5" ry="3" transform="rotate(-30 35 35)"/>
    <!-- tail -->
    <path d="M39 22 L45.5 24 L39 26 Z"/>
    <!-- head -->
    <ellipse cx="7.5" cy="24" rx="5.8" ry="4.6"/>
  </g>
  <circle cx="5.2" cy="21.8" r="1.05" fill="#1B2A1D"/>
  <circle cx="5.2" cy="26.2" r="1.05" fill="#1B2A1D"/>
  <!-- shell -->
  <ellipse cx="26" cy="25.5" rx="15" ry="13" fill="#4C7430"/>
  <ellipse cx="25" cy="24" rx="15" ry="13" fill="#5E8C3A"/>
  <!-- scute pattern -->
  <g fill="none" stroke="#4C7430" stroke-width="1.3" stroke-linejoin="round">
    <path d="M25 18 L30.5 21 L30.5 27 L25 30 L19.5 27 L19.5 21 Z"/>
    <path d="M25 18 L25 11.5 M30.5 21 L37.5 18.5 M30.5 27 L37.5 29.5 M25 30 L25 36.5 M19.5 27 L12.5 29.5 M19.5 21 L12.5 18.5"/>
  </g>
  <ellipse cx="19" cy="18" rx="6" ry="3.4" fill="#FFFFFF" opacity="0.22" transform="rotate(-25 19 18)"/>
</svg>
