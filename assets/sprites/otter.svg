<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Ribbit Rush otter, faces right (ART_BIBLE.md section 4: "rounded body, small ears, lighter
       muzzle, tail trailing"). Colours: otter #7A5230, muzzle #C58B5A (bible "Nature and
       pickups"). -->
  <!-- tail trailing to the left -->
  <path d="M4 24 C2 22 2 26 4 28 L16 25.5 L16 22.5 Z" fill="#6A4527"/>
  <path d="M5 24 C3.5 22.5 3.5 25.5 5 27 L16.5 24.5 L16.5 23.5 Z" fill="#7A5230"/>
  <!-- body -->
  <ellipse cx="27" cy="25" rx="15" ry="10" fill="#6A4527"/>
  <ellipse cx="27" cy="24" rx="15" ry="10" fill="#7A5230"/>
  <!-- head -->
  <circle cx="39" cy="20" r="8" fill="#6A4527"/>
  <circle cx="39" cy="19" r="8" fill="#7A5230"/>
  <!-- ears -->
  <circle cx="34.5" cy="13.5" r="2.6" fill="#7A5230"/>
  <circle cx="41" cy="12.5" r="2.6" fill="#7A5230"/>
  <!-- muzzle, lighter -->
  <ellipse cx="44.5" cy="21.5" rx="5" ry="4" fill="#C58B5A"/>
  <circle cx="46.5" cy="15.5" r="1.2" fill="#1B2A1D"/>
  <circle cx="41.5" cy="15" r="1.2" fill="#1B2A1D"/>
  <circle cx="48" cy="21" r="1" fill="#1B2A1D"/>
  <!-- highlight -->
  <ellipse cx="22" cy="18" rx="7" ry="3.4" fill="#FFFFFF" opacity="0.2" transform="rotate(-18 22 18)"/>
</svg>
