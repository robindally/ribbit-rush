<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Ribbit Rush taxi, faces right. Follows car.svg's construction. -->
  <g fill="#22242A">
    <rect x="7" y="8" width="9" height="7" rx="2.5"/>
    <rect x="31" y="8" width="9" height="7" rx="2.5"/>
    <rect x="7" y="33" width="9" height="7" rx="2.5"/>
    <rect x="31" y="33" width="9" height="7" rx="2.5"/>
  </g>
  <!-- front face (darker) then top face -->
  <rect x="3" y="11" width="42" height="26" rx="8" fill="#BF9A13"/>
  <rect x="3" y="11" width="42" height="21.3" rx="8" fill="#F5C518" stroke="#D0A714" stroke-width="1.5"/>
  <!-- cabin glass -->
  <rect x="13" y="13.5" width="23" height="16.5" rx="5" fill="#2B3A55"/>
  <rect x="18" y="15.5" width="12" height="12.5" rx="3.5" fill="#F7D34C"/>
  <!-- black checker strip across the roof -->
  <g fill="#22242A">
    <rect x="15" y="12.5" width="3.4" height="3.4" rx="0.6"/>
    <rect x="21.8" y="12.5" width="3.4" height="3.4" rx="0.6"/>
    <rect x="28.6" y="12.5" width="3.4" height="3.4" rx="0.6"/>
  </g>
  <!-- windshield glint -->
  <path d="M32.5 16.5 L34.2 26.5" fill="none" stroke="#9FB7E6" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
  <!-- highlight -->
  <ellipse cx="11.5" cy="15.5" rx="6" ry="2.4" fill="#FFFFFF" opacity="0.22"/>
  <ellipse cx="39" cy="15.5" rx="4" ry="2" fill="#FFFFFF" opacity="0.16"/>
  <!-- headlights (front, right) and taillights (rear, left) -->
  <rect x="42" y="14" width="3.2" height="5" rx="1.6" fill="#FFF1A8"/>
  <rect x="42" y="24.5" width="3.2" height="5" rx="1.6" fill="#FFF1A8"/>
  <rect x="2.8" y="14" width="3" height="5" rx="1.5" fill="#FF3B3B"/>
  <rect x="2.8" y="24.5" width="3" height="5" rx="1.5" fill="#FF3B3B"/>
</svg>
