<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Ribbit Rush</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#14162B" />
    <meta name="description" content="Ribbit Rush: a Frogger reimagining. Hop a frog home across five worlds of traffic and rivers." />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #14162b;
      }
      #app {
        display: flex;
        /* Top-aligned (not centred) so any free vertical space below the canvas - the common case
           on a tall portrait phone, where the canvas scales to width and stops well short of the
           viewport's height - collects entirely below it, where render/touchControls.ts's
           below-canvas d-pad/pause overlay needs it (M8 fix-up spec item 1). Makes no visible
           difference on desktop/landscape, where the canvas already fills almost the full
           viewport height (scale is height-bound there, not width-bound). */
        align-items: flex-start;
        justify-content: center;
        width: 100vw;
        height: 100vh;
      }
      canvas#game {
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
